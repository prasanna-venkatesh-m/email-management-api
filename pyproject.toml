[project]
name = "email-management-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prasanna", email = "prasannavenkatesh.m@arisecapital.in" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
email-management-api = "email_management_api:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
